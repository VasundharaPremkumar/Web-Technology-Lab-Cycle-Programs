<!DOCTYPE html> 
<html> 
<head> 
<title>Simple Calculator</title> 
<style> 
body{ 
font-family: Arial; 
background-color: lightblue; 
} 
.calculator{ 
width: 250px; 
margin: 100px auto; 
padding: 20px; 
background-color: white; 
border: 2px solid black; 
text-align: center; 
} 
input{ 
width: 200px; 
margin: 5px; 
padding: 5px; 
} 
button{ 
width: 45px; 
height: 35px; 
margin: 5px; 
font-weight: bold; 
} 
h3{ 
color: blue; 
} 
</style> 
<script> 
function calc(op) 
{ 
var a = parseFloat(document.getElementById("n1").value); 
var b = parseFloat(document.getElementById("n2").value); 
var result; 
if(op=='+') result = a+b; 
if(op=='-') result = a-b; 
if(op=='*') result = a*b; 
if(op=='/') result = a/b; 
document.getElementById("ans").innerHTML = "Result: " + result; 
}
</script> 
</head> 
<body> 
<div class="calculator"> 
<h2>Calculator</h2> 
<input type="number" id="n1" placeholder="First Number"><br> 
<input type="number" id="n2" placeholder="Second Number"><br> 
<button onclick="calc('+')">+</button> 
<button onclick="calc('-')">-</button> 
<button onclick="calc('*')">*</button> 
<button onclick="calc('/')">/</button> 
<h3 id="ans">Result:</h3> 
</div> 
</body> 
</html>
