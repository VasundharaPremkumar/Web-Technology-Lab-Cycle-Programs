<!-- b) Create a web page using frame. Divide the page into two parts with
Navigation links on left hand side of page (width=20%) and content page
on right hand side of page (width = 80%). On clicking the navigation Links
corresponding content must be shown on the right-hand side -->

<!Doctype html>
<html>
    <title>Frames</title>
    <head>
        <frameset cols="20%,80%">
            <frame src="left.html" name="left" style="background-color: aliceblue;">
            <frame src="right.html" name="right" style="background-color: bisque;">
        </frameset>
    </head>
</html>
